apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
data:
  # Base64 encoded values (echo -n "password" | base64)
  DB_USER: bXlzcWx1c2Vy      # mysqluser
  DB_PASSWORD: bXlzcWxwYXNz  # mysqlpass
  DB_NAME: bXlhcHA=          # myapp
  DB_ROOT_PASSWORD: cm9vdHBhc3M= # rootpass
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: default
type: Opaque
data:
  JWT_SECRET: c3VwZXJzZWNyZXRrZXlmb3Jqd3Q= # supersecretkeyforjwt