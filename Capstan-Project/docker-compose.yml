version: '3.8'

services:
  # Backend service running in development mode with hot reloading
  backend-dev:
    build:
      context: ./simpleChatserver
      dockerfile: Dockerfile.dev
    container_name: simple-chat-backend-dev
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: "http://localhost:5173,http://localhost:3000,http://frontend-dev:3000"
      CHAT_PRIMARY_COLOR: "#2563EB"
      CHAT_SECONDARY_COLOR: "#EFF6FF"
      CHAT_USER_MESSAGE_COLOR: "#2563EB"
    volumes:
      - ./simpleChatserver/src:/app/src
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - simple-chat-network

  # Frontend service running in development mode with Vite dev server
  frontend-dev:
    build:
      context: ./simpleChatui
      dockerfile: Dockerfile.dev
    container_name: simple-chat-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000"
      VITE_SOCKET_URL: "http://localhost:5000"
    volumes:
      - ./simpleChatui/src:/app/src
      - ./simpleChatui/public:/app/public
      - /app/node_modules
    depends_on:
      backend-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - simple-chat-network

networks:
  simple-chat-network:
    driver: bridge
