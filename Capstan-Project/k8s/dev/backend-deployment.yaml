apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dev
  namespace: simple-chat-dev
  labels:
    app: backend
    environment: development
    version: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
      environment: development
  template:
    metadata:
      labels:
        app: backend
        environment: development
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: backend
        image: ghcr.io/mdarifahammedreza/simple-chat-backend:dev-latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: backend-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
