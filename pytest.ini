[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=html
    --cov-report=term-summary

markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    security: marks tests as security tests

filterwarnings =
    error
    ignore::DeprecationWarning
