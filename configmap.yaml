apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  NODE_ENV: production
  API_PORT: "5000"
  FRONTEND_PORT: "3000"
  DB_HOST: database-service
  DB_PORT: "5432"
  DATABASE_URL: "postgresql://mysqluser:mysqlpass@database-service:5432/myapp"
  REACT_APP_API_URL: http://backend-service:5000/api
