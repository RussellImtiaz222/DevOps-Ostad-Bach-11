name: Backend Production Pipeline

on:
  push:
    branches:
      - prod
    paths:
      - 'Capstan-Project/simpleChatserver/**'
      - '.github/workflows/backend-prod.yml'
  pull_request:
    branches:
      - prod
    paths:
      - 'simpleChatserver/**'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/simple-chat-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Capstan-Project/simpleChatserver
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Generate version
        id: version
        run: |
          VERSION="v$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d ' ')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./Capstan-Project/simpleChatserver
          file: ./Capstan-Project/simpleChatserver/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:prod-${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:prod-latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.timestamp }}
            org.opencontainers.image.environment=production

  deploy-to-prod:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Production Deployment (Automatic)
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          echo "🚀 AUTOMATIC DEPLOYMENT TRIGGERED"
          echo ""
          echo "✓ Build and tests passed"
          echo "✓ Production image pushed: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:prod-latest"
          echo ""
          echo "📋 Argo CD is now syncing production environment"
          echo "   Application: backend-prod"
          echo "   Namespace: simple-chat-prod"
          echo ""
          echo "⏱️  Rolling update in progress (watch progress in Argo CD dashboard)"
          echo ""
          # Optional: Uncomment to integrate with Argo CD API
          # curl -X POST https://argocd-server/api/v1/applications/backend-prod/sync \
          #   -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
          #   -H "Content-Type: application/json"
