name: Frontend Production Pipeline

on:
  push:
    branches:
      - prod
    paths:
      - 'Capstan-Project/simpleChatui/**'
      - '.github/workflows/frontend-prod.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Capstan-Project/simpleChatui
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Generate version
        id: version
        run: |
          VERSION="v$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d ' ')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: ./Capstan-Project/simpleChatui
          file: ./Capstan-Project/simpleChatui/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/russelimtiaz222/frontend:prod-${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/russelimtiaz222/frontend:prod-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.timestamp }}

      - name: Production image pushed to GHCR
        run: echo "Frontend production image pushed successfully"

  deploy-to-prod:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
    
    steps:
      - name: Production Deployment
        run: |
          echo "Production image pushed to GHCR"
          echo "Argo CD can now sync frontend-prod application"
