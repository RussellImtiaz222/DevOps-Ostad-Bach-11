name: Frontend Dev & Stage Pipeline

on:
  push:
    branches:
      - dev
      - stage
    paths:
      - 'Capstan-Project/simpleChatui/**'
      - '.github/workflows/frontend-dev-stage.yml'
  pull_request:
    branches:
      - dev
      - stage
    paths:
      - 'Capstan-Project/simpleChatui/**'

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ${{ github.repository }}/simple-chat-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Capstan-Project/simpleChatui
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Generate version
        id: version
        run: |
          VERSION="v$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d ' ')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: ✅ Build successful
        run: echo "Frontend build completed successfully"

  deploy-to-dev:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: development
    
    steps:
      - name: Manual Deployment Required
        run: |
          echo "✓ Build and tests passed"
          echo "✓ Development image pushed to GHCR"
          echo ""
          echo "📋 Next step: Manually sync via Argo CD"
          echo "   argocd app sync frontend-dev"
          echo ""
          echo "   Or use Argo CD dashboard: https://argocd.example.com"

  deploy-to-stage:
    needs: build-and-test
    if: github.ref == 'refs/heads/stage' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
    
    steps:
      - name: Manual Deployment Required
        run: |
          echo "✓ Build and tests passed"
          echo "✓ Staging image pushed to GHCR"
          echo ""
          echo "📋 Next step: Manually sync via Argo CD"
          echo "   argocd app sync frontend-stage"
          echo ""
          echo "   Or use Argo CD dashboard: https://argocd.example.com"
